# 只有一台 Mac 能编译，所以 P1/P2/P3/P4 的分支在云端先过一遍：
# - unit：Linux 上跑 InkCore 的单元测试（便宜、快）
# - ios-build：macOS 上用 xcodebuild 把整个 App 编成 iOS 模拟器版（不签名，连 MyScript iink SDK 一起编）。
#   macOS 分钟数按 10 倍计费，只在 commit 信息带 [mac] 或手动触发时跑。
name: ci

on:
  push:
    branches: ["p1/**", "p2/**", "p3/**", "p4/**", "demo/**"]
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: InkCore tests
        if: hashFiles('Packages/InkCore/Tests/**') != ''
        run: swift test --package-path Packages/InkCore

  server:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Server build + tests
        if: hashFiles('Server/Package.swift') != ''
        run: swift test --package-path Server

  ios-build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[mac]')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      # MyScript 的 iink 包从 api.github.com 下载 130 MB 的二进制：带上 token，免得共享 IP 被限流
      - name: Token for SwiftPM binary downloads
        run: |
          printf 'machine api.github.com\n  login x-access-token\n  password %s\n' "${{ github.token }}" > ~/.netrc
          chmod 600 ~/.netrc
      - name: Build app for iOS Simulator
        run: |
          xcodebuild -project app/InkTutor.xcodeproj -scheme InkTutor \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)|iink SDK 没有编进来" build.log | sed -E 's#/Users/runner/work/[^ ]*/(Packages|app)/#\1/#' | sort -u | head -80
          grep -q "BUILD SUCCEEDED" build.log
      # 不用真机看界面：在 iPad 模拟器上用 -demo 摆出几个画面截图（浅色 + 深色），作为 artifact 下载
      - name: Screenshots on iPad Simulator
        continue-on-error: true
        run: |
          DEV=$(xcrun simctl list devices available | grep -E "iPad Pro 13-inch \(M4\)|iPad Pro \(12\.9-inch\)" | head -1 | grep -oE "[0-9A-F-]{36}")
          echo "device $DEV"
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl status_bar "$DEV" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          APP=$(find build/Build/Products -path "*iphonesimulator*" -name InkTutor.app | head -1)
          xcrun simctl install "$DEV" "$APP"
          # 装完第一次启动很慢：先空启动一次，免得第一张截成白屏
          xcrun simctl launch "$DEV" dev.handwriting.inktutor
          sleep 15
          mkdir -p shots
          for look in light dark; do
            xcrun simctl ui "$DEV" appearance $look
            for s in menu card reveal; do
              xcrun simctl launch --terminate-running-process "$DEV" dev.handwriting.inktutor -demo $s
              sleep 7
              xcrun simctl io "$DEV" screenshot "shots/$s-$look.png"
            done
          done
          ls -la shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
          if-no-files-found: ignore
