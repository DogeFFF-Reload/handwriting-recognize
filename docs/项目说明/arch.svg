<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 668" width="760" height="668" font-family="'Noto Sans CJK SC', 'Noto Sans SC', 'PingFang SC', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .t  { font-size: 13px; font-weight: 700; fill: #0f172a; }
      .s  { font-size: 10.5px; fill: #334155; }
      .xs { font-size: 9.5px; fill: #64748b; }
      .lbl { font-size: 10.5px; fill: #475569; }
      .ln { stroke: #475569; stroke-width: 1.4; fill: none; }
      .dev  { fill: #eef2ff; stroke: #4f46e5; stroke-width: 1.3; }
      .cld  { fill: #fff4e5; stroke: #d97706; stroke-width: 1.3; }
      .mac  { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 1.3; }
      .off  { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.3; stroke-dasharray: 4 3; }
      .neu  { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; }
      .grp  { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
    </style>
  </defs>

  <!-- 第一行：书写 → 采集 → 一段写完 -->
  <rect class="dev" x="20" y="20" width="150" height="58" rx="8"/>
  <text class="t" x="95" y="45" text-anchor="middle">Apple Pencil</text>
  <text class="s" x="95" y="63" text-anchor="middle">在整屏的纸上手写</text>

  <rect class="dev" x="210" y="20" width="200" height="58" rx="8"/>
  <text class="t" x="310" y="45" text-anchor="middle">PencilKit</text>
  <text class="s" x="310" y="63" text-anchor="middle">采集笔画（PKCanvasView）</text>

  <rect class="dev" x="450" y="20" width="290" height="58" rx="8"/>
  <text class="t" x="595" y="45" text-anchor="middle">双击 Pencil Pro / 点「完成一段」</text>
  <text class="s" x="595" y="63" text-anchor="middle">笔尖旁的菜单：函数 · 求解 · 几何 · 矩阵</text>

  <line class="ln" x1="170" y1="49" x2="207" y2="49" marker-end="url(#arrow)"/>
  <line class="ln" x1="410" y1="49" x2="447" y2="49" marker-end="url(#arrow)"/>

  <!-- 分成两路 -->
  <path class="ln" d="M595,78 L595,98 M270,98 L645,98"/>
  <line class="ln" x1="270" y1="98" x2="270" y2="125" marker-end="url(#arrow)"/>
  <line class="ln" x1="645" y1="98" x2="645" y2="125" marker-end="url(#arrow)"/>
  <text class="lbl" x="278" y="116">函数 / 求解 / 矩阵</text>
  <text class="lbl" x="653" y="116">几何</text>

  <!-- 识别链 -->
  <rect class="grp" x="20" y="128" width="500" height="150" rx="10"/>
  <text class="t" x="34" y="150">识别链：这一段笔迹 → LaTeX</text>
  <text class="xs" x="506" y="150" text-anchor="end">按顺序试，出错或结果为空就换下一个</text>

  <rect class="dev" x="32" y="164" width="104" height="76" rx="7"/>
  <text class="t" x="84" y="186" text-anchor="middle">MyScript iink</text>
  <text class="s" x="84" y="204" text-anchor="middle">设备端</text>
  <text class="xs" x="84" y="220" text-anchor="middle">数学识别</text>
  <text class="xs" x="84" y="233" text-anchor="middle">直接读笔画</text>

  <rect class="cld" x="156" y="164" width="104" height="76" rx="7"/>
  <text class="t" x="208" y="186" text-anchor="middle">百炼 Qwen</text>
  <text class="s" x="208" y="204" text-anchor="middle">云端</text>
  <text class="xs" x="208" y="220" text-anchor="middle">qwen3.8-flash</text>
  <text class="xs" x="208" y="233" text-anchor="middle" style="font-size:9px">失败换 qwen3-vl-plus</text>

  <rect class="mac" x="280" y="164" width="104" height="76" rx="7"/>
  <text class="t" x="332" y="186" text-anchor="middle">Server</text>
  <text class="s" x="332" y="204" text-anchor="middle">Mac 上的服务</text>
  <text class="xs" x="332" y="220" text-anchor="middle">收截图，转调 Qwen</text>
  <text class="xs" x="332" y="233" text-anchor="middle">Vapor</text>

  <rect class="off" x="404" y="164" width="104" height="76" rx="7"/>
  <text class="t" x="456" y="186" text-anchor="middle">回放</text>
  <text class="s" x="456" y="204" text-anchor="middle">断网演示</text>
  <text class="xs" x="456" y="220" text-anchor="middle">录好的 LaTeX</text>
  <text class="xs" x="456" y="233" text-anchor="middle">引擎都没配置时用</text>

  <line class="ln" x1="136" y1="202" x2="153" y2="202" marker-end="url(#arrow)"/>
  <line class="ln" x1="260" y1="202" x2="277" y2="202" marker-end="url(#arrow)"/>
  <line class="ln" x1="384" y1="202" x2="401" y2="202" marker-end="url(#arrow)"/>
  <text class="xs" x="34" y="264">云端只收到这一段的白底截图（PNG），只返回 LaTeX；设置里也可以指定引擎</text>

  <!-- LaTeX -->
  <line class="ln" x1="270" y1="278" x2="270" y2="297" marker-end="url(#arrow)"/>
  <rect class="neu" x="20" y="300" width="500" height="46" rx="8"/>
  <text class="t" x="270" y="320" text-anchor="middle">LaTeX 式子</text>
  <text class="s" x="270" y="337" text-anchor="middle">认错了可以点「改式子」手动改，或「改笔迹」重写</text>

  <!-- 本机计算 -->
  <line class="ln" x1="270" y1="346" x2="270" y2="365" marker-end="url(#arrow)"/>
  <rect class="grp" x="20" y="368" width="500" height="112" rx="10"/>
  <text class="t" x="34" y="390">本机计算（不交给大模型）</text>

  <rect class="dev" x="32" y="400" width="232" height="68" rx="7"/>
  <text class="t" x="148" y="420" text-anchor="middle">Solver</text>
  <text class="s" x="148" y="438" text-anchor="middle">求导 · 积分 · 极限 · 求和 · 解方程 · 取值</text>
  <text class="xs" x="148" y="455" text-anchor="middle">符号方法优先，不行再用数值方法</text>

  <rect class="dev" x="276" y="400" width="232" height="68" rx="7"/>
  <text class="t" x="392" y="420" text-anchor="middle">MatrixMath + MathEngine</text>
  <text class="s" x="392" y="438" text-anchor="middle">矩阵运算 · 逆矩阵 · 行列式</text>
  <text class="xs" x="392" y="455" text-anchor="middle">MathEngine 提供精确分数运算</text>

  <!-- 几何一路 -->
  <rect class="dev" x="550" y="128" width="190" height="352" rx="10"/>
  <text class="t" x="645" y="152" text-anchor="middle">几何草图识别</text>
  <text class="s" x="645" y="170" text-anchor="middle">设备端，不经过识别链</text>
  <line x1="566" y1="184" x2="724" y2="184" stroke="#c7d2fe"/>
  <text class="s" x="645" y="206" text-anchor="middle">ShapeRecognizer</text>
  <text class="s" x="645" y="224" text-anchor="middle">GeometrySketchRecognizer</text>
  <text class="xs" x="645" y="252" text-anchor="middle">笔画 → 折线、拐点</text>
  <text class="xs" x="645" y="270" text-anchor="middle">→ 标准图形</text>
  <line x1="566" y1="288" x2="724" y2="288" stroke="#c7d2fe"/>
  <text class="xs" x="645" y="310" text-anchor="middle">平面：三角形、四边形、</text>
  <text class="xs" x="645" y="326" text-anchor="middle">正多边形、圆、椭圆</text>
  <text class="xs" x="645" y="350" text-anchor="middle">立体：正方体、长方体、圆柱、</text>
  <text class="xs" x="645" y="366" text-anchor="middle">圆锥、球、棱柱、棱锥</text>
  <text class="xs" x="645" y="390" text-anchor="middle">修正手抖：真直角、真等腰</text>
  <text class="xs" x="645" y="414" text-anchor="middle">三角形 + 中线：</text>
  <text class="xs" x="645" y="430" text-anchor="middle">动态几何卡片</text>

  <!-- 输出 -->
  <line class="ln" x1="270" y1="480" x2="270" y2="505" marker-end="url(#arrow)"/>
  <line class="ln" x1="645" y1="480" x2="645" y2="505" marker-end="url(#arrow)"/>
  <rect class="dev" x="20" y="508" width="720" height="78" rx="10"/>
  <text class="t" x="380" y="531" text-anchor="middle">纸上的结果（都在本机绘制）</text>
  <text class="s" x="380" y="551" text-anchor="middle">标准式子（算出的部分为绿色）· 函数卡片：图像、零点、极值点、导函数、积分面积、系数滑条</text>
  <text class="s" x="380" y="569" text-anchor="middle">几何图形：拖节点改形状、课本标注、边长角度面积体积、三视图、平面变立体</text>

  <line class="ln" x1="380" y1="586" x2="380" y2="605" marker-end="url(#arrow)"/>
  <rect class="neu" x="200" y="608" width="360" height="30" rx="8"/>
  <text class="s" x="380" y="627" text-anchor="middle">草稿自动存在 iPad 上，重新打开按 LaTeX 重建</text>

  <!-- 图例 -->
  <rect class="dev" x="20" y="650" width="14" height="10" rx="2"/>
  <text class="xs" x="40" y="659">设备端</text>
  <rect class="cld" x="90" y="650" width="14" height="10" rx="2"/>
  <text class="xs" x="110" y="659">云端（阿里云百炼）</text>
  <rect class="mac" x="210" y="650" width="14" height="10" rx="2"/>
  <text class="xs" x="230" y="659">Mac 上的服务</text>
  <rect class="off" x="310" y="650" width="14" height="10" rx="2"/>
  <text class="xs" x="330" y="659">离线回放</text>
</svg>
